name: Bug report / خاتالىق
description: Reproduce a UI, writing, RTL or accessibility problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior / كۈتكەن ۋە كۆرۈلگەن نەتىجە
      description: Describe the concrete problem. Do not include secrets or private records.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / قايتا سىناش قەدەملىرى
      description: Add a small example or public reproduction link when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, browser and assistive technology
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Keyboard, RTL/LTR and reduced-motion observations
